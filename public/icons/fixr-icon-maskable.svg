<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="45%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background (no border-radius — maskable icons are cropped by OS) -->
  <rect width="512" height="512" fill="url(#bg2)"/>
  <!--
    Maskable icon safe zone = center 80% = 410×410 starting at (51,51).
    Lightning bolt kept well within that zone.
  -->
  <polygon
    points="290,105 168,272 242,272 218,407 342,240 268,240"
    fill="white"
    opacity="0.96"
  />
</svg>
