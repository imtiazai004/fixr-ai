<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="45%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Rounded background -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bg)"/>
  <!-- Inner glow -->
  <rect width="512" height="512" rx="110" ry="110" fill="rgba(255,255,255,0.06)"/>
  <!-- Lightning bolt ⚡ — white, centered -->
  <polygon
    points="306,58 148,274 246,274 206,454 364,238 266,238"
    fill="white"
    opacity="0.96"
    filter="url(#glow)"
  />
</svg>
